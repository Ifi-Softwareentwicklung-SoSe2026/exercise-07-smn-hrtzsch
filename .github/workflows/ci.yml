name: CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  truth-table-quality-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: csharp

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore TruthTable.slnx

      - name: Verify formatting
        run: dotnet format TruthTable.slnx --verify-no-changes --verbosity diagnostic

      - name: Build project
        run: dotnet build TruthTable.slnx --no-restore --configuration Release -warnaserror

      - name: Run tests
        run: dotnet test TruthTable.slnx --no-build --configuration Release --verbosity normal

      - name: Install Doxygen
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Generate RTF documentation
        working-directory: .
        run: doxygen Doxyfile

      - name: Upload RTF documentation
        uses: actions/upload-artifact@v4
        with:
          name: truth-table-rtf-documentation
          path: docs/rtf/refman.rtf
          if-no-files-found: error
